name: Unit tests

on:
  push:
  pull_request:

jobs:
  scoring-and-parsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check RGB scoring, historical parsers and symbolic rules
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest tests.test_scoring_and_parsers tests.test_symbolic_rules -v
